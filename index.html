<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>실험소1 메모장</title><style>*{box-sizing:border-box}body{font:16px system-ui;margin:24px auto;padding:0 16px;max-width:600px;background:white;color:#222}section,li{border:1px solid #ddd;border-radius:8px;padding:16px;margin:12px 0}input,textarea,button{font:inherit;padding:10px;margin:6px 0;max-width:100%}input,textarea{width:100%}button{cursor:pointer}li p{white-space:pre-wrap;overflow-wrap:anywhere}ul{list-style:none;padding:0}[hidden]{display:none!important}</style><h1>실험소1 메모장</h1><section id="auth"><form id="login"><label>이메일<input id="email" type="email" required autocomplete="username"></label><label>비밀번호<input id="password" type="password" minlength="6" required autocomplete="current-password"></label><button>로그인</button><button type="button" id="signup">회원가입</button></form></section><section id="app" hidden><p id="who"></p><button id="logout">로그아웃</button><form id="memo"><label>메모 내용<textarea id="content" rows="4" required></textarea></label><button>저장</button></form><ul id="list"></ul></section><p id="status" role="status" aria-live="polite"></p><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script>
const db=supabase.createClient('https://mhocohnheuiqjlqgjalq.supabase.co','sb_publishable_Gx71NytO2TGcozzyE6CnLA_f2lfwiZx');const el=id=>document.getElementById(id);let user=null;
async function run(fn){el('status').textContent='처리 중…';document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();el('status').textContent='';}catch(e){el('status').textContent='오류: '+e.message;}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
async function load(){const {data,error}=await db.from('memos').select('id,content,created_at').order('created_at',{ascending:false});if(error)throw error;el('list').replaceChildren();for(const m of data){const li=document.createElement('li'),p=document.createElement('p'),b=document.createElement('button');p.textContent=m.content;b.textContent='삭제';b.onclick=()=>run(async()=>{const {error}=await db.from('memos').delete().eq('id',m.id);if(error)throw error;await load();});li.append(p,b);el('list').append(li);}if(!data.length)el('list').textContent='저장된 메모가 없습니다.';}
async function show(session){user=session?.user||null;el('auth').hidden=!!user;el('app').hidden=!user;if(user){el('who').textContent=user.email;await load();}else{el('list').replaceChildren();el('content').value='';}}
el('login').onsubmit=e=>{e.preventDefault();run(async()=>{const {data,error}=await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error)throw error;el('password').value='';await show(data.session);});};
el('signup').onclick=()=>{if(!el('login').reportValidity())return;run(async()=>{const {data,error}=await db.auth.signUp({email:el('email').value.trim(),password:el('password').value});if(error)throw error;if(!data.session)throw Error('이메일 확인 설정을 확인해 주세요.');el('password').value='';await show(data.session);});};
el('logout').onclick=()=>run(async()=>{const {error}=await db.auth.signOut();if(error)throw error;await show(null);});
el('memo').onsubmit=e=>{e.preventDefault();run(async()=>{const content=el('content').value.trim();if(!content)throw Error('메모 내용을 입력하세요.');const {error}=await db.from('memos').insert({user_id:user.id,content});if(error)throw error;el('content').value='';await load();});};
db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')show(null);if(event==='TOKEN_REFRESHED')user=session?.user||null;});run(async()=>{const {data,error}=await db.auth.getSession();if(error)throw error;await show(data.session);});
</script></html>
